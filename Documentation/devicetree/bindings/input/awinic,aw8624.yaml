%YAML 1.2
---
$id: http://devicetree.org/schemas/input/awinic,aw8624.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW8624 LRA haptic controller

maintainers:
  - Danila Tikhonov <danila@jiaxyga.com>

properties:
  compatible:
    const: awinic,aw8624

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Falling edge interrupt from the INTN pin.

  reset-gpios:
    maxItems: 1
    description: Active low reset connected to the RSTN pin.

  awinic,f0-preset:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1000
    maximum: 3000
    description: Nominal LRA resonance frequency in tenths of a hertz.

  awinic,f0-calibration-percent:
    maximum: 7
    description: Maximum permitted deviation from the nominal resonance, in percent.

  awinic,drive-level:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 127
    description: Continuous drive amplitude in the DRV_LVL register.

  awinic,overdrive-level:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description: Overdrive amplitude in the DRV_LVL_OV register.

  awinic,drive-time:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 65535
    description: Continuous drive delay and braking time encoded in TD_H and TD_L.

  awinic,zero-cross-threshold:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 65535
    description: Zero crossing threshold encoded in ZC_THRSH_H and ZC_THRSH_L.

  awinic,brake-cycles:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 7
    description: Number of braking cycles after continuous playback.

  awinic,tset:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description: LRA timing configuration encoded in the TSET register.

  awinic,bemf-upper-threshold:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 65535
    description: Upper back EMF threshold encoded in BEMF_VTHH_H and BEMF_VTHH_L.

  awinic,bemf-lower-threshold:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 65535
    description: Lower back EMF threshold encoded in BEMF_VTHL_H and BEMF_VTHL_L.

  awinic,f0-trace-parameters:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Waveform period counts used for resonance detection.
    items:
      - description: Number of drive periods in the first detection interval.
        maximum: 15
      - description: Number of waiting periods between detection intervals.
        maximum: 15
      - description: Number of detection repetitions.
        minimum: 1
        maximum: 255
      - description: Number of drive periods in subsequent detection intervals.
        maximum: 255

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - awinic,f0-preset
  - awinic,f0-calibration-percent
  - awinic,drive-level
  - awinic,overdrive-level
  - awinic,drive-time
  - awinic,zero-cross-threshold
  - awinic,brake-cycles
  - awinic,tset
  - awinic,bemf-upper-threshold
  - awinic,bemf-lower-threshold
  - awinic,f0-trace-parameters

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        haptics@5a {
            compatible = "awinic,aw8624";
            reg = <0x5a>;
            interrupts-extended = <&gpio 10 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpio 4 GPIO_ACTIVE_LOW>;

            awinic,f0-preset = <2050>;
            awinic,f0-calibration-percent = <7>;
            awinic,drive-level = <106>;
            awinic,overdrive-level = <155>;
            awinic,drive-time = <0xf06c>;
            awinic,zero-cross-threshold = <0x08f8>;
            awinic,brake-cycles = <3>;
            awinic,tset = <0x11>;
            awinic,bemf-upper-threshold = <0x0008>;
            awinic,bemf-lower-threshold = <0x03f8>;
            awinic,f0-trace-parameters = <9 5 1 15>;
        };
    };
