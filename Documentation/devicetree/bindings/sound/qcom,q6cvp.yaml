%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,q6cvp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Core Voice Processor (Q6CVP)

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description:
  Q6CVP implements the voice processor (vocproc) that applies the RX/TX
  topologies and bridges the voice stream to the AFE codec ports.

allOf:
  - $ref: /schemas/soc/qcom/qcom,apr-services.yaml#

properties:
  compatible:
    enum:
      - qcom,q6cvp

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/soc/qcom,apr.h>

    apr {
        #address-cells = <1>;
        #size-cells = <0>;

        service@b {
            compatible = "qcom,q6cvp";
            reg = <APR_SVC_ADSP_CVP>;
            qcom,protection-domain = "avs/audio", "msm/adsp/audio_pd";
        };
    };
