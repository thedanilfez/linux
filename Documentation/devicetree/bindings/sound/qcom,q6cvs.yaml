%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,q6cvs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Core Voice Stream (Q6CVS)

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description:
  Q6CVS is the Q6DSP voice service that implements the vocoder stream. For
  modem-controlled calls the stream is created by the modem firmware; the
  application processor only holds a passive-control handle to it.

allOf:
  - $ref: /schemas/soc/qcom/qcom,apr-services.yaml#

properties:
  compatible:
    enum:
      - qcom,q6cvs

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/soc/qcom,apr.h>

    apr {
        #address-cells = <1>;
        #size-cells = <0>;

        service@a {
            compatible = "qcom,q6cvs";
            reg = <APR_SVC_ADSP_CVS>;
            qcom,protection-domain = "avs/audio", "msm/adsp/audio_pd";
        };
    };
