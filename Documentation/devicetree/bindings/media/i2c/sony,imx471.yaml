%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx471.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX471 Sensor

maintainers:
  - thedanilfez <thedanilfezlol@gmail.com>

description:
  The IMX471 sensor is a 4656x3496 image sensor, commonly found as the front
  camera in smartphones.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx471

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  vana-supply:
    description: Analog power supply (2.8 V).

  dvdd-supply:
    description: Digital core power supply (1.05 V).

  dovdd-supply:
    description: Interface power supply (1.8 V).

  reset-gpios:
    description: Reset GPIO (active low).
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 4
            maxItems: 4

          link-frequencies:
            items:
              - const: 702933333

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - vana-supply
  - dvdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,camcc-sdm845.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx471";
            reg = <0x10>;

            clocks = <&camcc CAM_CC_MCLK2_CLK>;

            assigned-clocks = <&camcc CAM_CC_MCLK2_CLK>;
            assigned-clock-rates = <19200000>;

            reset-gpios = <&tlmm 9 GPIO_ACTIVE_LOW>;

            vana-supply = <&cam_front_ldo>;
            dvdd-supply = <&cam_front_ldo>;
            dovdd-supply = <&cam_vio_ldo>;

            pinctrl-names = "default";
            pinctrl-0 = <&cam_front_default>;

            rotation = <270>;
            orientation = <0>;

            port {
                cam_front_endpoint: endpoint {
                    data-lanes = <0 1 2 3>;
                    link-frequencies = /bits/ 64 <702933333>;
                    remote-endpoint = <&camss_endpoint1>;
                };
            };
        };
    };
